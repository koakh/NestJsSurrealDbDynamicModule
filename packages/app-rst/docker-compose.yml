services:
  nestjs-surrealdb-rest-demo:
    image: koakh/nestjs-surrealdb-rest-demo:0.3.0
    hostname: nestjs-surrealdb-rest-demo
    container_name: nestjs-surrealdb-rest-demo
    restart: unless-stopped
    build:
      # build from the REPO ROOT (two levels up from this compose file):
      # the yarn workspace (and workspace:^ deps) must resolve
      context: ../..
      dockerfile: packages/app-rst/Dockerfile
    depends_on:
      - nestjs-surrealdb-rest-surrealdb
    # every value overridable from .env / shell (compose variable substitution),
    # defaults keep the demo stack working out of the box: the app reaches the db
    # by service hostname + CONTAINER port (not 127.0.0.1:8001, that would be the
    # app container itself); THROW_ERROR=false lets the app boot while the db is
    # still starting, the auto-reconnect picks it up
    environment:
      SURREALDB_URL: "${SURREALDB_URL:-ws://nestjs-surrealdb-rest-surrealdb:8000/rpc}"
      SURREALDB_NAMESPACE: "${SURREALDB_NAMESPACE:-test}"
      SURREALDB_DATABASE: "${SURREALDB_DATABASE:-test}"
      SURREALDB_USERNAME: "${SURREALDB_USERNAME:-root}"
      SURREALDB_PASSWORD: "${SURREALDB_PASSWORD:-root}"
      SURREALDB_INIT_SURREAL_DB_THROW_ERROR: "false"
    ports:
      - 3030:3030

  nestjs-surrealdb-rest-surrealdb:
    image: surrealdb/surrealdb:v4.0.1
    hostname: surrealdb
    container_name: nestjs-surrealdb-rest-surrealdb
    restart: unless-stopped
    # credentials via the image env vars (mapped to --user/--pass): SURREAL_USER/
    # SURREAL_PASS are the SERVER-side convention — fed from the same SURREALDB_USERNAME/
    # SURREALDB_PASSWORD vars the app uses (compose reads them from .env / shell,
    # defaults keep the local demo stack working out of the box).
    # NOTE: the persistent volume keeps the root user from the FIRST boot — changing
    # the password later needs a volume reset (`docker compose down -v`)
    command: start
    environment:
      SURREAL_USER: "${SURREALDB_USERNAME:-root}"
      SURREAL_PASS: "${SURREALDB_PASSWORD:-root}"
      SURREAL_PATH: "surrealkv:///data/surreal"
    volumes:
      - surrealdb-data:/data
    # uncomment to expose surrealdb port
    ports:
      - 8001:8000

volumes:
  surrealdb-data:
  